# Mines under test and the fixtures the tests use.  Select mines with
# `pytest --mine humanmine` (repeatable); the default is every mine listed.
#
# url        public root of the BlueGenes site (no trailing slash)
# webapp     path segment of the InterMine web service: <url>/<webapp>/service
# service_url  optional full root of the web service, for a deployment where it
#            is not published under `url` (e.g. http://localhost:8090/humanmine/service);
#            service tests use it, browser tests keep using `url`
# taxon      NCBI taxon id of the organism the fixture gene belongs to
# jbrowse    where JBrowse 1 is published for this mine; omit to skip those tests
# frontend   deployment-specific routes added by intermineorg/docker_template;
#            set each to false (or omit) for a mine deployed another way
# has_locations  false when the mine loads no chromosome locations: skips the
#            JBrowse REST tests and drops the location from the gene query (default true)
# has_tool_store  false when BlueGenes has no tool store / installed tools: skips
#            the tool listing and bundle-patch tests (default true)
# compare_with  key of a reference mine; its report page is compared tool by tool
#            (compare_exceptions: tool class -> reason it may differ)
# min_templates  the mine must publish at least this many templates (default 10)
# Any string value may use ${NAME} or ${NAME:-default}, replaced from the
# environment when the file is read.
# gene       a gene whose report page is used for the browser tests; data
#            below must match what the mine actually holds.  Its object id
#            is looked up at test start by primary_identifier (else symbol)
#            in the mine's taxon; gene.id is only the fallback
# gene.expect  which tool network calls are expected on that report page
# tools.rendered  BlueGenes tool panels (config.json toolName.cljs) that
#            must draw something on that report page

[mines.humanmine]
url = "https://www.humanmine.org"
webapp = "humanmine"
taxon = 9606
jbrowse = "https://www.humanmine.org/jbrowse/"

[mines.humanmine.frontend]
imjs_vendor = true          # nginx serves /vendor/imjs/im.min.js and injects it
align_sequence = true       # nginx routes /align-sequence to the aligner container
classic_webapp = "/query"   # the JSP webapp is published under this path

[mines.humanmine.gene]
id = 1234788                # fallback object id (report/Gene/<id>); the tests resolve the gene by primary_identifier
symbol = "PAX6"
primary_identifier = "5080"
chromosome = "11"
start = 31789026            # 1-based, as shown on the report page
end = 31817961
min_proteins = 5            # MSA viewer only calls the aligner with > 1 protein
pdb = "2CUE"                # one PDB entry the protein visualizer should list
# Pick a gene all of whose proteins have a primaryAccession: the protein
# visualizer and MSA viewer build a query "Protein.primaryAccession = <acc>"
# per protein and InterMine rejects it with 400 when one is null, so both
# tools fail on such genes (FlyMine Ubx, bcd, ey, lab, pb, prd, Sxl ...).

[mines.humanmine.gene.expect]
rcsb = true
align = true

[mines.humanmine.tools]
rendered = [
  "bluegenesJBrowseTool",
  "bluegenesProteinVisualizer",
  "bluegenesMSAViewer",
  "bluegenesHumanTissueExpressionVisualizer",
  "bluegenesProteinAtlasTissueExpressionVisualizer",
  "bluegenesToolCytoscape",
]

[mines.flymine]
url = "https://www.flymine.org"
webapp = "flymine"
taxon = 7227
jbrowse = "https://www.flymine.org/jbrowse/"

[mines.flymine.frontend]
imjs_vendor = true
align_sequence = true
classic_webapp = "/query"

[mines.flymine.gene]
id = 1033224                # fallback object id; resolved by primary_identifier at test start
symbol = "Scr"
primary_identifier = "FBgn0003339"
chromosome = "3R"
start = 6823120
end = 6849981
min_proteins = 4
pdb = "2R5Y"

[mines.flymine.gene.expect]
rcsb = true
align = true

[mines.flymine.tools]
rendered = [
  "bluegenesJBrowseTool",
  "bluegenesProteinVisualizer",
  "bluegenesMSAViewer",
  "bluegenesTissueExpressionVisualizer",
  "bluegenesToolCytoscape",
]

# The rdfc2im demo mine (https://github.com/intermine/rdfc2im, 113 human genes from RDF
# Portal) deployed on the same machine: BlueGenes on :5000, the web service on :8090 with
# no nginx front end, no chromosome locations, no JBrowse, no tool store.  Point it at
# another host or port with MINE_TESTS_LOCAL_URL (BlueGenes) and
# MINE_TESTS_LOCAL_SERVICE_URL (full web service root).
[mines.local]
url = "${MINE_TESTS_LOCAL_URL:-http://localhost:5000}"
service_url = "${MINE_TESTS_LOCAL_SERVICE_URL:-http://localhost:8090/humanmine/service}"
webapp = "humanmine"
taxon = 9606
has_locations = false
# the tool store of the stack at MINE_TESTS_LOCAL_URL: false for the default :5000 stack,
# MINE_TESTS_LOCAL_TOOL_STORE=true for a BlueGenes started with BLUEGENES_TOOL_PATH (e.g. :15001)
has_tool_store = "${MINE_TESTS_LOCAL_TOOL_STORE:-false}"
min_templates = 9

[mines.local.gene]
# no gene.id: the object id changes on every rebuild, so the tests look CYP2D6 up
# by primary_identifier
symbol = "CYP2D6"
primary_identifier = "1565" # NCBI gene id
min_proteins = 58           # proteins the demo mine holds for it; no pdb: the demo has no structures

[mines.local.frontend]
# /align-sequence on the BlueGenes origin; only when MINE_TESTS_LOCAL_ALIGN_SEQUENCE is non-empty
align_sequence = "${MINE_TESTS_LOCAL_ALIGN_SEQUENCE:-}"

[mines.local.gene.expect]
rcsb = false
align = false

[mines.local.tools]
rendered = []

# ---- local-hybrid: the milestone 1 profile ---------------------------------------
# The "ut" stack: a 6.0.0 mine on :18090 with the full HumanMine data set (as it is
# loaded), BlueGenes behind nginx on :15001 with HumanMine's tools, /align-sequence,
# imjs.  The values are what the milestone gate requires; each test that the stack's
# data cannot yet satisfy fails or skips for that reason.  [mines.local] stays the
# 5.1.1 baseline.  Run:  pytest --mine local-hybrid   (README, "The milestone gate").
# compare_with names the reference mine whose report page for the same gene is
# compared, tool by tool (test_tool_panels_match_reference).
[mines.local-hybrid]
url = "${MINE_TESTS_HYBRID_URL:-http://localhost:15001}"
service_url = "${MINE_TESTS_HYBRID_SERVICE_URL:-http://localhost:18090/humanmine/service}"
webapp = "humanmine"
taxon = 9606
has_locations = true
has_tool_store = true
min_templates = 9
# JBrowse 1 site of the stack, for the JBrowse REST/iframe tests.  Empty until the
# stack serves one (T1.4/T1.5); the iframe test then skips.
jbrowse = "${MINE_TESTS_HYBRID_JBROWSE:-}"
compare_with = "humanmine"

[mines.local-hybrid.frontend]
align_sequence = true
imjs_vendor = true

[mines.local-hybrid.gene]
symbol = "PAX6"
primary_identifier = "5080"
chromosome = "11"
start = 31789026
end = 31817961
min_proteins = 5
pdb = "2CUE"

[mines.local-hybrid.gene.expect]
rcsb = true
align = true

[mines.local-hybrid.tools]
rendered = [
  "bluegenesJBrowseTool",
  "bluegenesProteinVisualizer",
  "bluegenesMSAViewer",
  "bluegenesHumanTissueExpressionVisualizer",
  "bluegenesProteinAtlasTissueExpressionVisualizer",
  "bluegenesToolCytoscape",
  "bluegenesJBrowse2Tool",
]

# Tools that may differ from the reference, each with the reason (printed in the
# comparison table).  Empty at the milestone: nothing is excused.
[mines.local-hybrid.compare_exceptions]
