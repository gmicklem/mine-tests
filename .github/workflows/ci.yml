name: ci

# Checks that need no running mine, so that dependency updates (Renovate) are gated.
# The tests themselves all talk to a live mine (every test takes the `mine` fixture, which
# conftest.py parametrizes from mines.toml), so they are run by nightly.yml; here they are
# only collected, which imports every test module, loads mines.toml (with the ${NAME:-default}
# expansion) and checks the markers (`--strict-markers` is in pytest.ini).
on:
  push:
    branches:
      - main
      - maint-2026
      - 'maint/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt flake8
      # The repository has no linter configuration and some unused imports, so this is the
      # errors-only set of flake8: syntax errors, undefined names, broken comparisons and
      # format strings (E9, F63, F7, F82).
      - name: Lint
        run: |
          python -m compileall -q conftest.py tests tools
          python -m flake8 --select=E9,F63,F7,F82 --show-source conftest.py tests tools
          bash -n run-browser-tests.sh
      - name: Collect the tests, none runs because they need a live mine
        run: pytest --collect-only -q
